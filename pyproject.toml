[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-kalshi-automation"
version = "0.1.0"
description = "Automatización de señales de Telegram hacia Kalshi"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "telethon>=1.36,<2",
]

[project.scripts]
telegram-kalshi = "telegram_kalshi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
